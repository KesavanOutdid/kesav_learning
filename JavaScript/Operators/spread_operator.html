<!DOCTYPE html>
<html>
    <body>
        <div>
            The JavaScript spread operator (...) allows us to quickly copy all or part of an existing array or object into another array or object.
        </div>
        <p>The spread operator simplifies syntax, making it more readable and concise when copying, merging, or manipulating arrays and objects.</p>
        
        <p id="CopyinganArray"></p>
        
        <p id="MergingArrays"></p>
        
        <p id="FunctionArguments"></p>
        
        <p id="CopyinganObject"></p>
        
        <p id="MergingObjects"></p>
        
        <script>
            // Copying an Array
            const originalArray = [1, 2, 3];
            const copiedArray = [...originalArray]; // [1, 2, 3]
            document.getElementById("CopyinganArray").innerHTML = `Copied Array: [${copiedArray}]`;
        
            // Merging Arrays
            const array1 = [1, 2, 3];
            const array2 = [4, 5, 6];
            const mergedArray = [...array1, ...array2]; // [1, 2, 3, 4, 5, 6]
            document.getElementById("MergingArrays").innerHTML = `Merged Arrays: [${mergedArray}]`;
        
            // Function Arguments
            function sum(x, y, z) {
                return x + y + z;
            }
            const numbers = [1, 2, 3];
            const functionResult = sum(...numbers); // 6
            document.getElementById("FunctionArguments").innerHTML = `Function Result: ${functionResult}`;
        
            // Copying an Object
            const originalObject = { a: 1, b: 2 };
            const copiedObject = { ...originalObject }; // { a: 1, b: 2 }
            document.getElementById("CopyinganObject").innerHTML = `Copied Object: { a: ${copiedObject.a}, b: ${copiedObject.b} }`;
        
            // Merging Objects
            const object1 = { a: 1, b: 2 };
            const object2 = { c: 3, d: 4 };
            const mergedObject = { ...object1, ...object2 }; // { a: 1, b: 2, c: 3, d: 4 }
            document.getElementById("MergingObjects").innerHTML = `Merged Objects: { a: ${mergedObject.a}, b: ${mergedObject.b}, c: ${mergedObject.c}, d: ${mergedObject.d} }`;
        </script>
    </body>
</html>
