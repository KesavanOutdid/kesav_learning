<!DOCTYPE html>
<html>
    <body>
        <p>The `replaceAll()` method replaces all matches of a string with another string:</p>
        <p id="demo"></p>

        <script>
            let text = "I love apples, and apples are great.apples";
            document.getElementById("demo").innerHTML = text.replaceAll("apples", "bananas"); // I love bananas, and bananas are great.
        </script>
    </body>
</html>
