<!DOCTYPE html>
<html>
    <body>
        <p>The `replace()` method replaces a specified value with another value in a string:</p>
        <p id="demo"></p>

        <script>
            let text = "Hello World";
            document.getElementById("demo").innerHTML = text.replace("World", "Kesavan"); // Hello Kesavan
        </script>
    </body>
</html>
