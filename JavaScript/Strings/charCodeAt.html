<!DOCTYPE html>
<html>
    <body>
        <p>The `charCodeAt()` method returns the Unicode of the character at a specified index:</p>
        <p id="demo"></p>

        <script>
            let text = "Kesavan";
            document.getElementById("demo").innerHTML = text.charCodeAt(2); // Unicode of 'K' is 75
        </script>
    </body>
</html>
