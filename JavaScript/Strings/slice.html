<!DOCTYPE html>
<html>
    <body>
        <p>The `slice()` method extracts a part of a string:</p>
        <p id="demo"></p>

        <script>
            let text = "Apple, Banana, Kiwi";
            document.getElementById("demo").innerHTML = text.slice(0, 8); // Banana
        </script>
    </body>
</html>
