<!DOCTYPE html>
<html>
    <body>
        <p>The `split()` method splits a string into an array of substrings:</p>
        <p id="demo"></p>

        <script>
            let text = "a,b,c,d,e";
            let result = text.split(",");
            document.getElementById("demo").innerHTML = result[2]; // a,b,c,d,e
        </script>
    </body>
</html>
