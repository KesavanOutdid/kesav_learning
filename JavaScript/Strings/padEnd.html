<!DOCTYPE html>
<html>
    <body>
        <p>The `padEnd()` method pads the string at the end with another string:</p>
        <p id="demo"></p>

        <script>
            let text = "5";
            document.getElementById("demo").innerHTML = text.padEnd(4, "3"); // "5000"
        </script>
    </body>
</html>
