<!DOCTYPE html>
<html>
    <body>
        <div>A string is converted to upper case with toUpperCase():</div>
        <p id="demo"></p>
        <script>
            let text1 = "Hello World!";
            let text2 = text1.toUpperCase(); 
            console.log(text2);
            document.getElementById("demo").innerHTML = text2;
            // O/p: HELLO WORLD!
        </script>
    </body>
</html>
