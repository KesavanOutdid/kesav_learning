<!DOCTYPE html>
<html>
    <body>
        <p>The `at()` method returns the character at a specified index:</p>
        <p id="demo"></p>

        <p>Bracket notation allows accessing a character at a specific index:</p>
        <p id="demo2"></p>
        <script>
            let text = "Kesavan";
            document.getElementById("demo").innerHTML = text.at(-1); // K
            let texts = "Kesavan";
            document.getElementById("demo2").innerHTML = texts[0]; // K
        </script>
    </body>
</html>
