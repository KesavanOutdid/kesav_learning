<!DOCTYPE html>
<html>
    <body>
        <p>The `trim()` method removes whitespace from both sides of a string:</p>
        <p id="demo"></p>

        <p id="demo2"></p>

        <script>
            let text = "   Hello World!   ";
            document.getElementById("demo").innerHTML = text.trim(); // Hello World!
            let text2 = text.trim();
            document.getElementById("demo2").innerHTML ="Length text1 = " + text.length + "<br>Length text2 = " + text2.length;
        </script>
    </body>
</html>
