<!DOCTYPE html>
<html>
    <body>
        <div> A string is converted to lower case with toLowerCase():</div>
        <p id="demo"></p>
        <script>
            let text1 = "Hello World!";
            let text2 = text1.toLowerCase(); 
            console.log(text2);
            document.getElementById("demo").innerHTML = text2;
            // O/p: hello world!
        </script>
    </body>
</html>
