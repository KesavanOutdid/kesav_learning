<!DOCTYPE html>
<html>
    <body>
        <p>The `padStart()` method pads the string at the start with another string:</p>
        <p id="demo"></p>

        <script>
            let text = "5";
            document.getElementById("demo").innerHTML = text.padStart(7, "0"); // "0005"
        </script>
    </body>
</html>
