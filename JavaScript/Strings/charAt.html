<!DOCTYPE html>
<html>
    <body>
        <p>The `charAt()` method returns the character at a specified index:</p>
        <p>No, charAt() does not support negative indexing.</p>
        <p id="demo"></p>

        <script>
            let text = "Kesavan";
            document.getElementById("demo").innerHTML = text.charAt(0); // K
        </script>
    </body>
</html>
