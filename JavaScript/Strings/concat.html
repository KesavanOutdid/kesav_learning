<!DOCTYPE html>
<html>
    <body>
        <p>The `concat()` method concatenates two or more strings:</p>
        <p id="demo"></p>

        <script>
            let text1 = "Hello";
            let text2 = "World";
            document.getElementById("demo").innerHTML = text1.concat(" ", text2); // Hello World
        </script>
    </body>
</html>
