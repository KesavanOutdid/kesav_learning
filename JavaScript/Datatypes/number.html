<!DOCTYPE html>
<html>
    <body>
        <div>Number</div>
        <p>Represents numeric values, both integers and floating-point numbers.</p>
        <script>
            var a = 10;
            var b =5.10;
            console.log(typeof(a)); // O/p: Number
            console.log(typeof(b)); // O/p: Number
        </script>
    </body>
</html>
