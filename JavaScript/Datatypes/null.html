<!DOCTYPE html>
<html>
    <body>
        <div>Null</div>
        <p>Represents the intentional absence of any object value. It's a primitive type, but typeof null returns "object" due to a quirk in JavaScript</p>
        <script>
            var z =null
            console.log(z); // O/p: null
            console.log(typeof(z)); // O/p: object
        </script>
    </body>
</html>
