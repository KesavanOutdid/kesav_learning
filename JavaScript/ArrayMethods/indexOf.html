<!DOCTYPE html>
<html>
    <body>
        <h2>The indexOf() Method</h2>

        <p>The indexOf() method of Array instances returns the first index at which a given element can be found in the array, or -1 if it is not present.</p>

        <p id="demo"></p>

        <script>
            const animals = ['1', '2', '3', '4', '9', '2', '10' , '2'];
            document.getElementById("demo").innerHTML = animals.indexOf('2');
        </script>

    </body>
</html>
