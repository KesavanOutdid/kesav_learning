<!DOCTYPE html>
<html>
    <body>
        <h2>The lastIndexOf() Method</h2>

        <p>The lastIndexOf() method of Array instances returns the last index at which a given element can be found in the array, 
            or -1 if it is not present. The array is searched backwards, starting at fromIndex.</p>

        <p id="demo"></p>

        <script>
            const animals = ['1', '2', '3', '4', '5', '2', '7', '2', '8', '5'];
            document.getElementById("demo").innerHTML = animals.lastIndexOf('5');
        </script>

    </body>
</html>
