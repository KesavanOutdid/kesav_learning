<!DOCTYPE html>
<html>
    <body>
        <div> Add a new iteam to an array</div>
        <p>The element(s) to add to the end of the array.</p>
        <p id="demo"></p>
        <script>
            const fruits = ["Banana", "Orange", "Apple"];
            fruits.push("Mango");
            document.getElementById("demo").innerHTML = fruits;
            // O/p: Banana,Orange,Apple,Mango
        </script>
    </body>
</html>
