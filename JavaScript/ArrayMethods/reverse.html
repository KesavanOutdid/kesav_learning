<!DOCTYPE html>
<html>
    <body>
        <div>  All array elements to reverse.</div>
        <p id="demo"></p>
        <script>
            const fruits = ["Banana", "Orange", "Apple"];
            fruits.reverse();
            document.getElementById("demo").innerHTML = fruits;
            // O/p:Apple,Orange,Banana
        </script>
    </body>
</html>
