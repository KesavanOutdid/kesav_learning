<!DOCTYPE html>
<html>
    <body>
    <h2>The keys Method</h2>

    <p>The keys() method of Array instances returns a new array iterator object that contains the keys for each index in the array.</p>
    
    <script>
       const array1 = ['a', 'b', '4', ' c', 9];
        const iterator = array1.keys();

        for (const key of iterator) {
            console.log(key);
        }

    </script>

    </body>
</html>
