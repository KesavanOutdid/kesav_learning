<!DOCTYPE html>
<html>
    <body>
        <div> The length property sets or returns the number of elements in an array.</div>
        <p id="demo"></p>
        <script>
            const fruits = ["Banana", "Orange", "Apple", "Mango"];
            fruits.length = 2;
            document.getElementById("demo").innerHTML = fruits;
            // O/p: Banana,Orange
        </script>
    </body>
</html>
