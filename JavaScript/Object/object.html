<!DOCTYPE html>
<html>
    <body>
        <div>
            <p>A method is a function definition stored as a property value.</p><br/>
        </div>
        <script>
            var person = {
                firstName: "John",
                lastName: "Doe",
                id: 5566,
                
            };
            const fullName = () => {
                console.log(person.firstName + " " + person.lastName);
            }
            fullName(); // O/p: John Doe
        </script>
    </body>
</html>
