<!DOCTYPE html>
<html>
    <body>
        <div>Nested Objects</div>
        <p>Property values in an object can be other objects:</p>
        <p id="demo"></p>

        <script>
            // Create nested Objects
            const myObj = {
              name: "John",
              age: 30,
              myCars: {
                car1: "Ford",
                car2: "BMW",
                car3: "Fiat"
              }
            }
            document.getElementById("demo").innerHTML = myObj.myCars.car2;
            console.log( myObj.myCars.car2);
        </script>
    </body>
</html>
